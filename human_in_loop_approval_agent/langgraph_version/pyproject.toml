[project]
name = "hitl-langgraph"
version = "0.1.0"
description = "Human-in-the-loop Approval Agent using LangGraph interruptible workflows"
requires-python = ">=3.10"

dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.ruff.lint.per-file-ignores]
# CLI entry point: stdout is the output channel, not a logging smell.
"graph.py" = ["T20"]
