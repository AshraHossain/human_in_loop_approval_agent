[project]
name = "hitl-approval-agent"
version = "0.1.0"
description = "Human-in-the-loop approval agent gating Jira writes behind a durable approval step"
requires-python = ">=3.11"

dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hitl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
# CLI entry point: stdout is the output channel, not a logging smell.
"src/hitl/cli.py" = ["T20"]
